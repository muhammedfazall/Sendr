name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

  migrate-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Apply DB migrations to Neon
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend/migrations:/migrations" \
            migrate/migrate:v4.18.3 \
            -path=/migrations \
            -database "${{ secrets.NEON_DB_URL }}" \
            up

      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
