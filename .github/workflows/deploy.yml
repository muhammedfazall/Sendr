name: Continuous Deployment (CD)

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sendr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Sendr
            
            # Pull down changes to configuration files (Compose structure)
            git pull origin main
            
            cd backend
            
            # Authenticate and pull down the freshest image build
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker compose -f docker-compose.prod.yml pull
            
            # Run background components and refresh stack gracefully
            docker compose -f docker-compose.prod.yml up -d db redis
            
            echo "Waiting for database to accept connections..."
            sleep 5
            
            # Automatically run database migrations using containerization
            docker compose -f docker-compose.prod.yml run --rm --entrypoint sh server -c "
              wget -qO- https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz &&
              ./migrate -path ./migrations -database \"postgres://sendr:${{ secrets.DB_PASSWORD }}@db:5432/sendr?sslmode=disable\" up
            "
            
            # Bring up the newly updated application container
            docker compose -f docker-compose.prod.yml up -d server
            
            # Prune obsolete dangling images to prevent disk space leaks
            docker image prune -f